version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: django_chat_redis
    ports:
      - "6379:6379"

  web:
    build: .
    container_name: django_chat_web
    command: >
      sh -c "python manage.py makemigrations chatApp &&
             python manage.py migrate &&
             daphne -b 0.0.0.0 -p 8000 conf.asgi:application"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      - redis
